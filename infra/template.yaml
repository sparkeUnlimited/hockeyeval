AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Hockey tryout evaluation app backend (SAM path). Mirrors lib/tryout-stack.js: Cognito user pool with
  admin/evaluator groups, DynamoDB single table (GSI1, GSI2), AppSync with APPSYNC_JS resolvers, one Lambda
  for Cognito admin ops + S3 presign, private exports bucket, S3 + CloudFront (OAC) for the web app.
  Players are identified by pinnie colour + number only; nothing here stores a name.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 256

Resources:
  # ------------------------------------------------------------------ Cognito
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: tryout-evaluator
      UserPoolTier: ESSENTIALS      # required for email one-time-code sign-in
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "OFF"
      # Deliberately only "email": the app never stores anyone's name.
      Schema:
        - Name: email
          Required: true
          Mutable: true
          AttributeDataType: String
      Policies:
        SignInPolicy:
          AllowedFirstAuthFactors: [PASSWORD, EMAIL_OTP]
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 14
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Your tryout evaluator login
          EmailMessage: >-
            You have been added as a tryout evaluator. Sign in with {username} and the temporary password {####}.
            You will be asked to choose a new password the first time you sign in.

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: tryout-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      TokenValidityUnits:
        IdToken: hours
        AccessToken: hours
        RefreshToken: days
      IdTokenValidity: 1
      AccessTokenValidity: 1
      RefreshTokenValidity: 30

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admin
      Description: "Convenor: full access, by number only"

  EvaluatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: evaluator
      Description: "Evaluator: own scores only"

  # ------------------------------------------------------------------ DynamoDB
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: TryoutTable   # fixed: resolvers use it for BatchGetItem / BatchPutItem
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1   # every evaluation for one player; evaluator profiles (GSI1PK = USERS)
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2   # every evaluation in a tryout (optionally one session) for the admin
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS

  # ------------------------------------------------------------------ S3: private exports
  ExportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - { Id: expire, Status: Enabled, ExpirationInDays: 400 }
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: ["*"]      # the presigned URL is the authorisation
            AllowedHeaders: [content-type]
            MaxAge: 300

  ExportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ExportsBucket
      PolicyDocument:
        Statement:
          - Sid: EnforceSSL
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ExportsBucket.Arn, !Sub "${ExportsBucket.Arn}/*"]
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # ------------------------------------------------------------------ Lambda (admin ops only)
  AdminOpsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: createEvaluator / deleteEvaluator (Cognito) and exportUrl (S3 presign)
      CodeUri: lambda/
      Handler: admin-ops.handler
      LoggingConfig:
        LogGroup: !Ref AdminOpsLogGroup
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          TABLE_NAME: !Ref Table
          EXPORTS_BUCKET: !Ref ExportsBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminDeleteUser
                - cognito-idp:ListUsers
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:DeleteItem]
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub "${ExportsBucket.Arn}/exports/*"

  AdminOpsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  # ------------------------------------------------------------------ AppSync
  # Resolver code is bundled by `npm run bundle` (esbuild) into .build/resolvers/ before `sam build`.
  Api:
    Type: AWS::Serverless::GraphQLApi
    Properties:
      Name: tryout-evaluator
      SchemaUri: ./schema.graphql
      XrayEnabled: false
      Auth:
        Type: AMAZON_COGNITO_USER_POOLS
        UserPool:
          UserPoolId: !Ref UserPool
          AwsRegion: !Ref AWS::Region
          DefaultAction: ALLOW
      # Errors only, never request/response bodies: notes must not land in logs.
      Logging:
        FieldLogLevel: ERROR
        ExcludeVerboseContent: true
      DataSources:
        DynamoDb:
          TableDs:
            TableName: !Ref Table
            TableArn: !GetAtt Table.Arn
        Lambda:
          AdminOpsDs:
            FunctionArn: !GetAtt AdminOpsFunction.Arn
      Functions:
        getCurrentPointer:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: TableDs
          CodeUri: ./.build/resolvers/Query.currentTryout.1.getPointer.js
        getTryout:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: TableDs
          CodeUri: ./.build/resolvers/Fn.getTryout.js
        myEvaluations:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: TableDs
          CodeUri: ./.build/resolvers/Query.myEvaluations.js
        allEvaluations:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: TableDs
          CodeUri: ./.build/resolvers/Query.allEvaluations.js
        evaluators:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: TableDs
          CodeUri: ./.build/resolvers/Query.evaluators.js
        loadEvalContext:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: TableDs
          CodeUri: ./.build/resolvers/Mutation.upsertEvaluation.1.loadContext.js
        putEvaluation:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: TableDs
          CodeUri: ./.build/resolvers/Mutation.upsertEvaluation.2.put.js
        createTryout:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: TableDs
          CodeUri: ./.build/resolvers/Mutation.createTryout.js
        countSessions:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: TableDs
          CodeUri: ./.build/resolvers/Mutation.addSession.1.count.js
        putSession:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: TableDs
          CodeUri: ./.build/resolvers/Mutation.addSession.2.put.js
        upsertPlayers:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: TableDs
          CodeUri: ./.build/resolvers/Mutation.upsertPlayers.js
        setPlayerActive:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: TableDs
          CodeUri: ./.build/resolvers/Mutation.setPlayerActive.js
        setEvaluatorAccess:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: TableDs
          CodeUri: ./.build/resolvers/Mutation.setEvaluatorAccess.js
        closeTryout:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: TableDs
          CodeUri: ./.build/resolvers/Mutation.closeTryout.1.close.js
        adminOps:
          Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
          DataSource: AdminOpsDs
          CodeUri: ./.build/resolvers/Lambda.adminOps.js
      Resolvers:
        Query:
          currentTryout:
            Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
            CodeUri: ./.build/resolvers/Pipeline.passthrough.js
            Pipeline: [getCurrentPointer, getTryout]
          myEvaluations:
            Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
            CodeUri: ./.build/resolvers/Pipeline.passthrough.js
            Pipeline: [myEvaluations]
          allEvaluations:
            Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
            CodeUri: ./.build/resolvers/Pipeline.passthrough.js
            Pipeline: [allEvaluations]
          evaluators:
            Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
            CodeUri: ./.build/resolvers/Pipeline.passthrough.js
            Pipeline: [evaluators]
        Mutation:
          upsertEvaluation:
            Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
            CodeUri: ./.build/resolvers/Pipeline.passthrough.js
            Pipeline: [loadEvalContext, putEvaluation]
          createTryout:
            Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
            CodeUri: ./.build/resolvers/Pipeline.passthrough.js
            Pipeline: [createTryout]
          addSession:
            Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
            CodeUri: ./.build/resolvers/Pipeline.passthrough.js
            Pipeline: [countSessions, putSession]
          upsertPlayers:
            Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
            CodeUri: ./.build/resolvers/Pipeline.passthrough.js
            Pipeline: [upsertPlayers]
          setPlayerActive:
            Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
            CodeUri: ./.build/resolvers/Pipeline.passthrough.js
            Pipeline: [setPlayerActive]
          setEvaluatorAccess:
            Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
            CodeUri: ./.build/resolvers/Pipeline.passthrough.js
            Pipeline: [setEvaluatorAccess]
          closeTryout:
            Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
            CodeUri: ./.build/resolvers/Pipeline.passthrough.js
            Pipeline: [closeTryout, getTryout]
          createEvaluator:
            Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
            CodeUri: ./.build/resolvers/Pipeline.passthrough.js
            Pipeline: [adminOps]
          deleteEvaluator:
            Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
            CodeUri: ./.build/resolvers/Pipeline.passthrough.js
            Pipeline: [adminOps]
          exportUrl:
            Runtime: { Name: APPSYNC_JS, Version: "1.0.0" }
            CodeUri: ./.build/resolvers/Pipeline.passthrough.js
            Pipeline: [adminOps]

  # ------------------------------------------------------------------ Web hosting: S3 + CloudFront (OAC)
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: EnforceSSL
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt WebBucket.Arn, !Sub "${WebBucket.Arn}/*"]
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: no-referrer, Override: true }
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true }
          XSSProtection: { Protection: true, ModeBlock: true, Override: true }
        CustomHeadersConfig:
          Items:
            - { Header: Permissions-Policy, Value: "camera=(), microphone=(), geolocation=()", Override: true }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: tryout-evaluator web
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          Compress: true
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  GraphqlUrl:
    Value: !GetAtt Api.GraphQLUrl
  Region:
    Value: !Ref AWS::Region
  WebBucketName:
    Value: !Ref WebBucket
  ExportsBucketName:
    Value: !Ref ExportsBucket
  DistributionId:
    Value: !Ref Distribution
  CloudFrontUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  TableName:
    Value: !Ref Table

# Hockey tryout evaluation API.
# Players are identified ONLY by pinnie colour + number (e.g. "W-14").
# There is intentionally no field anywhere in this schema that can carry a
# player's name, birthdate, photo or contact details. Do not add one.

schema {
  query: Query
  mutation: Mutation
}

type Tryout {
  id: ID!
  name: String!
  season: String!
  status: String!          # open | closed
  createdAt: AWSDateTime
  sessions: [Session!]!
  players: [Player!]!
  # True when the caller is on this tryout's evaluator list and enabled.
  # Named groups of players (e.g. "Team 1") reused across scrimmages. A player may be on several teams.
  teams: [Team!]!
  canEvaluate: Boolean!
  # Admin only: who may score this tryout. Ids only.
  evaluatorAccess: [EvaluatorAccess!]! @aws_auth(cognito_groups: ["admin"])
}

type Team {
  id: ID!
  name: String!            # a label like "Team 1" or "Team Red" — never a person's name
  colour: String           # the team's jersey colour; every player on the team defaults to it
  players: [ID!]!          # playerNumbers on this team
}

# Which team plays in a session and what colour it wears. Players on no listed team are not dressed for it.
type SessionTeam {
  teamId: ID!
  colour: String!
}

input SessionTeamInput {
  teamId: ID!
  colour: String!
}

type EvaluatorAccess {
  evaluatorId: ID!
  enabled: Boolean!
  updatedAt: AWSDateTime
}

type Session {
  id: ID!
  label: String!
  date: AWSDate!
  type: String!            # skills | scrimmage | game
  order: Int!
  jersey: String!          # primary | secondary: the DEFAULT jersey colour for this session
  absent: [ID!]!           # playerNumbers marked absent for this session (hidden from evaluators, writes rejected)
  colours: AWSJSON         # per-player overrides for this session: { "W-14": "Red", ... }. Wins over teams and jersey.
  teams: [SessionTeam!]!   # scrimmage/game: the teams on the ice and their colours. Empty = everyone plays.
}

# A player's number never changes. Every player gets two jersey colours at registration; the
# playerNumber identity is built from the primary colour ("W-14") and stays fixed for the tryout.
type Player {
  playerNumber: ID!        # "<primary colour letter>-<two digit number>", e.g. "W-14"
  colour: String!          # primary jersey colour
  colour2: String          # secondary jersey colour (worn in sessions marked jersey = secondary)
  number: Int!
  position: String!        # F | D | G
  active: Boolean!
  tag: String              # short admin label shown to evaluators, e.g. "AA" (still considered for the AA team)
}

type Evaluation {
  playerNumber: ID!
  sessionId: ID!
  evaluatorId: ID!         # Cognito sub of the evaluator; always taken from identity, never from args
  scores: AWSJSON!         # { criterionKey: 1..5 }
  tier: String             # A | B | C | X
  notes: String            # <= 280 chars, no names
  updatedAt: AWSDateTime!
  clientId: ID
}

type EvaluationPage {
  items: [Evaluation!]!
  nextToken: String
}

type EvaluatorProfile {
  id: ID!
  displayName: String!     # e.g. "Evaluator 3"
  role: String!
}

input PlayerInput {
  colour: String!
  colour2: String
  number: Int!
  position: String!
  active: Boolean
  tag: String
}

type Query {
  # The tryout evaluators and admin are working on (most recently created).
  currentTryout: Tryout

  # An evaluator's own scores for one session. Filtered server-side by identity.
  myEvaluations(tryoutId: ID!, sessionId: ID!): [Evaluation!]!

  # Admin only: every evaluation in the tryout, optionally for a single session.
  allEvaluations(tryoutId: ID!, sessionId: ID, nextToken: String): EvaluationPage!
    @aws_auth(cognito_groups: ["admin"])

  # Admin only.
  evaluators: [EvaluatorProfile!]! @aws_auth(cognito_groups: ["admin"])
}

type Mutation {
  # Upsert. evaluatorId comes from the caller's identity. Rejected when the tryout is closed or the
  # caller is not an enabled evaluator on the tryout.
  upsertEvaluation(
    tryoutId: ID!
    sessionId: ID!
    playerNumber: ID!
    scores: AWSJSON!
    tier: String
    notes: String
    clientId: ID!
  ): Evaluation!

  createTryout(name: String!, season: String!): Tryout! @aws_auth(cognito_groups: ["admin"])
  addSession(tryoutId: ID!, label: String!, date: AWSDate!, type: String!, jersey: String): Session!
    @aws_auth(cognito_groups: ["admin"])
  # Change a session's label, date, type or jersey (all optional; omitted fields keep their value).
  updateSession(tryoutId: ID!, sessionId: ID!, label: String, date: AWSDate, type: String, jersey: String): Session!
    @aws_auth(cognito_groups: ["admin"])
  upsertPlayers(tryoutId: ID!, players: [PlayerInput!]!): [Player!]! @aws_auth(cognito_groups: ["admin"])
  setPlayerActive(tryoutId: ID!, playerNumber: ID!, active: Boolean!): Player!
    @aws_auth(cognito_groups: ["admin"])
  # Change a player's position and/or secondary colour. Number and primary colour are the identity: to change
  # those, delete the player and add them again.
  updatePlayer(tryoutId: ID!, playerNumber: ID!, position: String, colour2: String, tag: String): Player!
    @aws_auth(cognito_groups: ["admin"])
  # Mark a player present/absent for one session. Absent players are hidden from evaluators for that session
  # and any score for them in that session is rejected, so a missed skate never counts as an evaluation.
  setAttendance(tryoutId: ID!, sessionId: ID!, playerNumber: ID!, present: Boolean!): Session!
    @aws_auth(cognito_groups: ["admin"])
  createTeam(tryoutId: ID!, name: String!, colour: String): Team! @aws_auth(cognito_groups: ["admin"])
  # Rename a team and/or change its colour (omitted fields keep their value).
  updateTeam(tryoutId: ID!, teamId: ID!, name: String, colour: String): Team! @aws_auth(cognito_groups: ["admin"])
  deleteTeam(tryoutId: ID!, teamId: ID!): ID! @aws_auth(cognito_groups: ["admin"])
  # Replace a team's roster.
  setTeamPlayers(tryoutId: ID!, teamId: ID!, players: [ID!]!): Team! @aws_auth(cognito_groups: ["admin"])
  # Replace the teams playing in a session (with colours). Empty list = no teams, everyone plays.
  setSessionTeams(tryoutId: ID!, sessionId: ID!, teams: [SessionTeamInput!]!): Session!
    @aws_auth(cognito_groups: ["admin"])
  # Replace the session's per-player jersey colours ({ playerNumber: colour }). Empty object clears all overrides.
  setSessionColours(tryoutId: ID!, sessionId: ID!, colours: AWSJSON!): Session!
    @aws_auth(cognito_groups: ["admin"])
  # Remove a player that has no scores yet (wrong number, entered twice). Players with scores must be released.
  deletePlayer(tryoutId: ID!, playerNumber: ID!): ID! @aws_auth(cognito_groups: ["admin"])
  # Lambda-backed (Cognito AdminCreateUser). Cognito emails the temporary password.
  createEvaluator(email: AWSEmail!, displayName: String!): EvaluatorProfile!
    @aws_auth(cognito_groups: ["admin"])
  # Lambda-backed. Removes the Cognito user and their profile. Their scores are kept (by id only).
  deleteEvaluator(id: ID!): ID! @aws_auth(cognito_groups: ["admin"])
  closeTryout(tryoutId: ID!): Tryout! @aws_auth(cognito_groups: ["admin"])
  # Add an evaluator to a tryout, or switch their access on/off. Disabled evaluators' writes are rejected.
  setEvaluatorAccess(tryoutId: ID!, evaluatorId: ID!, enabled: Boolean!): EvaluatorAccess!
    @aws_auth(cognito_groups: ["admin"])
  # Lambda-backed. Presigned S3 PUT URL for a CSV export (valid 5 minutes).
  exportUrl(tryoutId: ID!, filename: String!): AWSURL! @aws_auth(cognito_groups: ["admin"])
}

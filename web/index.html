<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tryout Evaluator — Sign in</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b57d0'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E14%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tryouts">
</head>
<body>
<main class="page login">
  <div class="logo" aria-hidden="true">🏒</div>
  <h1 style="text-align:center">Tryout Evaluator</h1>
  <p class="muted small" style="text-align:center">Players are numbers, not names.</p>

  <div id="status" class="notice" hidden></div>

  <form id="loginForm" class="card" autocomplete="on">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p id="loginError" class="error" role="alert" hidden></p>
    <button id="loginBtn" class="btn primary block" type="submit">Sign in</button>
  </form>

  <form id="newPasswordForm" class="card" hidden>
    <h2>Choose a new password</h2>
    <p class="muted small">Your temporary password worked. Pick a password you'll remember: at least 8 characters with a number.</p>
    <div class="field">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="field">
      <label for="newPassword2">Repeat new password</label>
      <input id="newPassword2" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <p id="newPasswordError" class="error" role="alert" hidden></p>
    <button id="newPasswordBtn" class="btn primary block" type="submit">Set password and sign in</button>
  </form>

  <p class="muted small" style="text-align:center">Forgot your password? Ask the convenor to reset it.</p>
</main>

<script src="vendor/amazon-cognito-identity.min.js"></script>
<script type="module">
  import { signIn, whoAmI, homeFor, config } from "./js/auth.js";
  import { registerServiceWorker } from "./js/api.js";
  registerServiceWorker();

  const $ = (id) => document.getElementById(id);
  const status = $("status");

  if (!config.userPoolId || config.userPoolId.includes("XXXX")) {
    status.hidden = false; status.className = "notice bad";
    status.textContent = "This copy of the app has no configuration. Run scripts/deploy.sh to generate js/config.js.";
  }

  // Already signed in? Go straight to the right screen.
  try {
    const me = await whoAmI();
    if (me) location.replace(homeFor(me.groups));
  } catch { /* fall through to the form */ }

  let pending = null;
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("loginError"); err.hidden = true;
    const btn = $("loginBtn"); btn.disabled = true; btn.textContent = "Signing in…";
    try {
      const result = await signIn($("email").value.trim(), $("password").value);
      if (result.kind === "newPassword") {
        pending = result;
        $("loginForm").hidden = true;
        $("newPasswordForm").hidden = false;
        $("newPassword").focus();
      } else {
        location.replace(homeFor(result.groups));
      }
    } catch (ex) {
      err.textContent = friendly(ex); err.hidden = false;
    } finally {
      btn.disabled = false; btn.textContent = "Sign in";
    }
  });

  $("newPasswordForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("newPasswordError"); err.hidden = true;
    const a = $("newPassword").value, b = $("newPassword2").value;
    if (a !== b) { err.textContent = "The two passwords don't match."; err.hidden = false; return; }
    const btn = $("newPasswordBtn"); btn.disabled = true;
    try {
      const groups = await pending.complete(a);
      location.replace(homeFor(groups));
    } catch (ex) {
      err.textContent = friendly(ex); err.hidden = false; btn.disabled = false;
    }
  });

  function friendly(ex) {
    const code = ex?.code || ex?.name || "";
    if (code === "NotAuthorizedException" || code === "UserNotFoundException") return "Email or password is incorrect.";
    if (code === "PasswordResetRequiredException") return "Your password was reset. Ask the convenor for a new temporary password.";
    if (code === "InvalidPasswordException") return "Password needs at least 8 characters including a number.";
    if (code === "NetworkError" || /network|fetch/i.test(ex?.message || "")) return "No connection. Check Wi-Fi and try again.";
    if (code === "LimitExceededException") return "Too many attempts. Wait a minute and try again.";
    return ex?.message || "Sign-in failed.";
  }
</script>
</body>
</html>
